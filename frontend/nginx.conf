# ============================================================================
# SupplyMind AI — Frontend Nginx Configuration (Security-Hardened)
# ============================================================================

# Hide Nginx version from response headers
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Body Size Limit (prevent large-payload DoS) ─────────────────────────
    client_max_body_size 10m;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;

    # ── Security Headers (applied to all responses) ─────────────────────────
    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Modern XSS protection (CSP replaces legacy X-XSS-Protection)
    add_header X-XSS-Protection "0" always;

    # Control referrer information leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict browser feature access
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy for the React SPA
    # Allows: self, Clerk SDK, Google Fonts, inline styles (needed by React/Tailwind)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://clerk.supplymind.tech https://*.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.clerk.accounts.dev https://clerk.supplymind.tech https://*.clerk.com https://api.supplymind.tech; frame-src https://*.clerk.accounts.dev https://clerk.supplymind.tech https://*.clerk.com; worker-src 'self' blob:;" always;

    # HSTS (enforce HTTPS) — Traefik/Dokploy terminates TLS, but browser
    # should still remember to use HTTPS for future requests
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Agent Discovery Link Headers ────────────────────────────────────────
    # Machine-readable discovery for AI agents and standards-compliant crawlers.
    add_header Link "<https://supplymind.tech/.well-known/agent-card.json>; rel=\"describedby\"; type=\"application/json\", <https://supplymind.tech/.well-known/api-catalog>; rel=\"describedby\"; type=\"application/linkset+json\", <https://supplymind.tech/.well-known/auth.md>; rel=\"describedby\"; type=\"text/markdown\", <https://supplymind.tech/llms.txt>; rel=\"alternate\"; type=\"text/plain\"" always;

    # ── API Proxy ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # Limit API request body size
        client_max_body_size 5m;

        # Advertise the endpoint catalog to API clients
        add_header Link "<https://supplymind.tech/.well-known/api-catalog>; rel=\"describedby\"; type=\"application/linkset+json\", <https://supplymind.tech/.well-known/auth.md>; rel=\"describedby\"; type=\"text/markdown\"" always;
    }

    # ── Auth Proxy ──────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Advertise the auth guide to API clients
        add_header Link "<https://supplymind.tech/.well-known/auth.md>; rel=\"describedby\"; type=\"text/markdown\", <https://supplymind.tech/.well-known/oauth-authorization-server>; rel=\"describedby\"; type=\"application/json\"" always;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Agent Discovery Documents (.well-known) ─────────────────────────────
    # Serve machine-readable discovery docs with correct Content-Type headers.
    # Extensionless JSON files need explicit MIME types (nginx defaults to
    # application/octet-stream). Files are static, so no proxy is involved.
    location ^~ /.well-known/ {
        add_header Cache-Control "no-cache" always;

        # auth.md → text/markdown
        location = /.well-known/auth.md {
            default_type text/markdown;
        }

        # api-catalog (RFC 9264 Linkset) → application/linkset+json
        location = /.well-known/api-catalog {
            default_type application/linkset+json;
        }

        # api-catalog.json (verbose endpoint catalog) → application/json
        location = /.well-known/api-catalog.json {
            default_type application/json;
        }

        # Agent Card (A2A) → application/json
        location = /.well-known/agent-card.json {
            default_type application/json;
        }

        # OAuth / OIDC discovery documents → application/json
        location = /.well-known/oauth-authorization-server {
            default_type application/json;
        }

        location = /.well-known/oauth-protected-resource {
            default_type application/json;
        }

        location = /.well-known/openid-configuration {
            default_type application/json;
        }

        # Unmatched .well-known files keep default type (application/octet-stream)
        try_files $uri =404;
    }

    # ── SPA Fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;

        # Advertise agent discovery docs on the SPA document itself
        add_header Link "<https://supplymind.tech/.well-known/agent-card.json>; rel=\"describedby\"; type=\"application/json\", <https://supplymind.tech/.well-known/api-catalog>; rel=\"describedby\"; type=\"application/linkset+json\", <https://supplymind.tech/.well-known/auth.md>; rel=\"describedby\"; type=\"text/markdown\", <https://supplymind.tech/llms.txt>; rel=\"alternate\"; type=\"text/plain\"" always;
    }

    # ── Static Asset Caching ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
